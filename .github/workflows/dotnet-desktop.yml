name: dotnet-desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Extract Assembly Info from CSPROJ
        id: meta
        run: |
          [xml]$csproj = Get-Content ./TrLynxWpfUi/TrLynxWpfUi.csproj
          $title = $csproj.Project.PropertyGroup.AssemblyTitle
          $version = $csproj.Project.PropertyGroup.AssemblyVersion
          $shortVersion = ($version -split '\.')[0..2] -join '.'
          echo "ZIP_BASE_NET6=${title}V${shortVersion}net6" >> $env:GITHUB_ENV
          echo "ZIP_BASE_NET8=${title}V${shortVersion}net8" >> $env:GITHUB_ENV

      # === .NET 6 Build ===
      - name: Publish TrLynxWpfUi project (.NET 6)
        run: |
          dotnet publish ./TrLynxWpfUi/TrLynxWpfUi.csproj `
            -c Release `
            -f net6.0-windows `
            -r win-x64 `
            --self-contained false `
            /p:PublishReadyToRun=true `
            -o TrLynxWpfUi/publish/net6

      - name: Remove .pdb files (.NET 6)
        run: |
          $publishDir = "TrLynxWpfUi\publish\net6"
          if (Test-Path $publishDir) {
            Get-ChildItem $publishDir -Recurse -Filter *.pdb | Remove-Item -Force
          } else {
            Write-Error "Publish directory '$publishDir' not found."
          }

      - name: Upload .NET 6 build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_BASE_NET6 }}
          path: TrLynxWpfUi/publish/net6

      # === .NET 8 Build ===
      - name: Publish TrLynxWpfUi project (.NET 8)
        run: |
          dotnet publish ./TrLynxWpfUi/TrLynxWpfUi.csproj `
            -c Release `
            -f net8.0-windows `
            -r win-x64 `
            --self-contained false `
            /p:PublishReadyToRun=true `
            -o TrLynxWpfUi/publish/net8

      - name: Remove .pdb files (.NET 8)
        run: |
          $publishDir = "TrLynxWpfUi\publish\net8"
          if (Test-Path $publishDir) {
            Get-ChildItem $publishDir -Recurse -Filter *.pdb | Remove-Item -Force
          } else {
            Write-Error "Publish directory '$publishDir' not found."
          }

      - name: Upload .NET 8 build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_BASE_NET8 }}
          path: TrLynxWpfUi/publish/net8
