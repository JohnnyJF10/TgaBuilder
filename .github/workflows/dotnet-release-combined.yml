name: dotnet-release-combined

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      artifact-name-standard: ${{ steps.meta.outputs.artifact_name_standard }}
      artifact-name-avalonia-windows: ${{ steps.meta.outputs.artifact_name_avalonia_windows }}
      artifact-name-avalonia-linux: ${{ steps.meta.outputs.artifact_name_avalonia_linux }}
      last-commit-msg: ${{ steps.commit.outputs.message }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Extract version and artifact names from csproj
        id: meta
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content ./TrLynxWpfUi/TrLynxWpfUi.csproj
          $title = $csproj.Project.PropertyGroup.AssemblyTitle
          $version = $csproj.Project.PropertyGroup.AssemblyVersion
          $shortVersion = ($version -split '\.')[0..2] -join '.'
          $tag = "v$shortVersion"
          $artifactNameStandard = "${title}-Standard-V${shortVersion}"
          $artifactNameAvaloniaWindows = "${title}-PreviewAvalonia-Windows-V${shortVersion}"
          $artifactNameAvaloniaLinux = "${title}-PreviewAvalonia-Linux-V${shortVersion}"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "artifact_name_standard=$artifactNameStandard" >> $env:GITHUB_OUTPUT
          echo "artifact_name_avalonia_windows=$artifactNameAvaloniaWindows" >> $env:GITHUB_OUTPUT
          echo "artifact_name_avalonia_linux=$artifactNameAvaloniaLinux" >> $env:GITHUB_OUTPUT

      - name: Get last commit message
        id: commit
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=format:"%s"
          echo "message=$msg" >> $env:GITHUB_OUTPUT

      # Standard: WPF .NET 6
      - name: Publish WPF .NET 6 (Standard)
        run: |
          dotnet publish ./TrLynxWpfUi/TrLynxWpfUi.csproj `
            -c Release `
            -f net6.0-windows `
            -r win-x64 `
            /p:SelfContained=false `
            /p:PublishReadyToRun=true `
            /p:PublishSingleFile=false `
            -o publish/standard

      - name: Remove .pdb files (Standard)
        shell: pwsh
        run: |
          Get-ChildItem publish/standard -Recurse -Filter *.pdb | Remove-Item -Force

      - name: Zip Standard
        shell: pwsh
        run: |
          $zipName = "${{ steps.meta.outputs.artifact_name_standard }}.zip"
          Compress-Archive -Path publish/standard/* -DestinationPath $zipName

      - name: Upload Standard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name_standard }}
          path: ${{ steps.meta.outputs.artifact_name_standard }}.zip

      # Preview Avalonia: Windows, self-contained
      - name: Publish Avalonia Windows (self-contained)
        run: |
          dotnet publish ./TrLynxAvaloniaUi/TrLynxAvaloniaUi.csproj `
            -c Release `
            -f net8.0 `
            -r win-x64 `
            --self-contained true `
            /p:PublishReadyToRun=false `
            /p:PublishSingleFile=true `
            -o publish/avalonia-windows

      - name: Remove .pdb files (Avalonia Windows)
        shell: pwsh
        run: |
          Get-ChildItem publish/avalonia-windows -Recurse -Filter *.pdb | Remove-Item -Force

      - name: Zip Avalonia Windows
        shell: pwsh
        run: |
          $zipName = "${{ steps.meta.outputs.artifact_name_avalonia_windows }}.zip"
          Compress-Archive -Path publish/avalonia-windows/* -DestinationPath $zipName

      - name: Upload Avalonia Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name_avalonia_windows }}
          path: ${{ steps.meta.outputs.artifact_name_avalonia_windows }}.zip

      # Preview Avalonia: Linux, self-contained (cross-compiled)
      - name: Publish Avalonia Linux (self-contained)
        run: |
          dotnet publish ./TrLynxAvaloniaUi/TrLynxAvaloniaUi.csproj `
            -c Release `
            -f net8.0 `
            -r linux-x64 `
            --self-contained true `
            /p:PublishReadyToRun=false `
            /p:PublishSingleFile=true `
            -o publish/avalonia-linux

      - name: Remove .pdb files (Avalonia Linux)
        shell: pwsh
        run: |
          Get-ChildItem publish/avalonia-linux -Recurse -Filter *.pdb | Remove-Item -Force

      - name: Zip Avalonia Linux
        shell: pwsh
        run: |
          $zipName = "${{ steps.meta.outputs.artifact_name_avalonia_linux }}.zip"
          Compress-Archive -Path publish/avalonia-linux/* -DestinationPath $zipName

      - name: Upload Avalonia Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name_avalonia_linux }}
          path: ${{ steps.meta.outputs.artifact_name_avalonia_linux }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Standard Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name-standard }}
          path: ./artifact

      - name: Download Avalonia Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name-avalonia-windows }}
          path: ./artifact

      - name: Download Avalonia Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name-avalonia-linux }}
          path: ./artifact

      # New: Fix permissions and make linux binary executable
      - name: Fix Linux executable permissions
        run: |
          LINUX_ZIP="./artifact/${{ needs.build.outputs.artifact-name-avalonia-linux }}.zip"
          LINUX_TAR="./artifact/${{ needs.build.outputs.artifact-name-avalonia-linux }}.tar.gz"
          
          unzip -q "$LINUX_ZIP" -d ./temp-linux
          
          chmod +x ./temp-linux/TrLynxAvaloniaUi
          
          cd temp-linux
          tar -czf "../$LINUX_TAR" *
          cd ..
          
          rm "$LINUX_ZIP"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.tag }}
          body: ${{ needs.build.outputs.last-commit-msg }}
          files: |
            ./artifact/${{ needs.build.outputs.artifact-name-standard }}.zip
            ./artifact/${{ needs.build.outputs.artifact-name-avalonia-windows }}.zip
            ./artifact/${{ needs.build.outputs.artifact-name-avalonia-linux }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
